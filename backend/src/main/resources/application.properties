spring.application.name=tourister-backend

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (Defaults to H2 in-memory if DATABASE_URL is not set)
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:touristerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (For Dev/Debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Seeding Configuration
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:admin@tourister.com}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:Admin@12345}
app.initial-admin.fullName=${INITIAL_ADMIN_NAME:System Administrator}
app.initial-admin.phone=${INITIAL_ADMIN_PHONE:+1-800-555-0199}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
